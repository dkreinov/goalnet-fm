<text x="0" y="210" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">The model outputs a full distribution, not a single guess — downstream heads turn it into a pick.</text>
